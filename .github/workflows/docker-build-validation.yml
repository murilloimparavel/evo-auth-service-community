name: Validate Auth Docker Image

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-pr:
    # Build PRs without publishing. This validates the Dockerfile without
    # requiring registry credentials or publishing unreviewed code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Build PR image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build without publishing (amd64)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          # EVO-1999: deploy images must bake RAILS_ENV=production (the Dockerfile
          # defaults to development for the local compose).
          build-args: |
            RAILS_ENV=production
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max
